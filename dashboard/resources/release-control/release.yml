name: Release dashboard

on:
  push:
    branches: ['**']
    paths:
      - '.release-command.json'
      - 'dashboard/**'
      - 'requests/builds/**'
      - 'channels/production.json'

permissions:
  contents: write

env:
  CI_RELEASE: 'true'
  RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  command:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.read.outputs.action }}
      version: ${{ steps.read.outputs.version }}
      channel: ${{ steps.read.outputs.channel }}
      tag: ${{ steps.read.outputs.tag }}
      platform: ${{ steps.read.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const command = JSON.parse(fs.readFileSync('.release-command.json', 'utf8'));
          const output = process.env.GITHUB_OUTPUT;
          for (const key of ['action', 'version', 'channel', 'tag', 'platform']) {
            fs.appendFileSync(output, `${key}=${command[key] || ''}\n`);
          }
          NODE

  macos:
    needs: command
    if: needs.command.outputs.action == 'build' && needs.command.outputs.platform == 'macos'
    runs-on: macos-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm version "${{ needs.command.outputs.version }}" --no-git-tag-version
      - run: npm run package:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dashboard/release/*.dmg
            dashboard/release/*.zip
            dashboard/release/*.yml
            dashboard/release/*.blockmap
          if-no-files-found: error

  windows:
    needs: command
    if: needs.command.outputs.action == 'build' && needs.command.outputs.platform == 'windows'
    runs-on: windows-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm version "${{ needs.command.outputs.version }}" --no-git-tag-version
      - run: npm run package:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dashboard/release/*.exe
            dashboard/release/*.yml
            dashboard/release/*.blockmap
          if-no-files-found: error

  publish-platform:
    needs: [command, macos, windows]
    if: always() && needs.command.outputs.action == 'build' && (needs.macos.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: release-*, path: release, merge-multiple: true }
      - name: Create or update the versioned release
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          tag="${{ needs.command.outputs.tag }}"
          if ! gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            args=(--repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Dashboard v${{ needs.command.outputs.version }}" --notes "Platform builds are uploaded independently by the dashboard.")
            if [[ "${{ needs.command.outputs.channel }}" == "beta" ]]; then args+=(--prerelease); fi
            gh release create "$tag" "${args[@]}"
          fi
          gh release upload "$tag" release/* --repo "${GITHUB_REPOSITORY}" --clobber

  record-build-result:
    needs: [command, macos, windows, publish-platform]
    if: always() && needs.command.outputs.action == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - name: Synchronize release-control branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"
      - name: Write local build result manifest
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: '${{ needs.command.outputs.version }}'
          PLATFORM: '${{ needs.command.outputs.platform }}'
          TAG: '${{ needs.command.outputs.tag }}'
          PLATFORM_RESULT: "${{ needs.command.outputs.platform == 'macos' && needs.macos.result || needs.windows.result }}"
          PUBLISH_RESULT: '${{ needs.publish-platform.result }}'
          WORKFLOW_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const success = process.env.PLATFORM_RESULT === 'success' && process.env.PUBLISH_RESULT === 'success';
          let release = {};
          if (success) {
            release = JSON.parse(execFileSync('gh', ['release', 'view', process.env.TAG, '--repo', process.env.GITHUB_REPOSITORY, '--json', 'assets,publishedAt,url'], { encoding: 'utf8' }));
          }
          const result = {
            schemaVersion: 1,
            status: success ? 'success' : 'failed',
            platform: process.env.PLATFORM,
            version: process.env.VERSION,
            tag: process.env.TAG,
            completedAt: new Date().toISOString(),
            workflowUrl: process.env.WORKFLOW_URL,
            releaseUrl: release.url,
            publishedAt: release.publishedAt,
            assets: (release.assets || []).map((asset) => asset.name),
            ...(!success ? { error: `GitHub Actions failed to build ${process.env.PLATFORM} v${process.env.VERSION}. Workflow: ${process.env.WORKFLOW_URL}` } : {}),
          };
          const file = path.join('results', 'builds', process.env.PLATFORM, `${process.env.VERSION}.json`);
          fs.mkdirSync(path.dirname(file), { recursive: true });
          fs.writeFileSync(file, `${JSON.stringify(result, null, 2)}\n`);
          NODE
      - name: Commit build result manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/builds/${{ needs.command.outputs.platform }}/${{ needs.command.outputs.version }}.json"
          git commit -m "result: dashboard ${{ needs.command.outputs.platform }} v${{ needs.command.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  promote:
    needs: command
    if: needs.command.outputs.action == 'promote'
    runs-on: ubuntu-latest
    steps:
      - name: Select the production release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release edit "${{ needs.command.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" --latest
